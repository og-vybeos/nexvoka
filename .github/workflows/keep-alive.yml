name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 12 * * 1,4'   # Mondays and Thursdays, noon UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping prod
        run: |
          curl -sS -o /dev/null -w "prod: %{http_code}\n" \
            "${{ secrets.SB_PROD_URL }}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SB_PROD_ANON_KEY }}"
      - name: Ping dev
        run: |
          curl -sS -o /dev/null -w "dev: %{http_code}\n" \
            "${{ secrets.SB_DEV_URL }}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SB_DEV_ANON_KEY }}"
